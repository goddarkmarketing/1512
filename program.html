  <script>document.write('<script src="assets/js/tt-cache-version.js?t='+Date.now()+'"><\/script>');</script>
  <script>document.write('<script src="assets/js/data-fallback.js?v='+(encodeURIComponent(window.__TT_SCRIPT_V||Date.now()))+'"><\/script>');</script>
  <script>document.write('<script src="assets/js/data.js?v='+(encodeURIComponent(window.__TT_SCRIPT_V||Date.now()))+'"><\/script>');</script>
  <script>document.write('<script src="assets/js/main.js?v='+(encodeURIComponent(window.__TT_SCRIPT_V||Date.now()))+'"><\/script>');</script>
  <script>
    const ALERT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/></svg>';

    function renderProgramPage() {
      const { PROGRAMS, PACKAGES_2D1N, PACKAGES_3D2N, PACKAGES_4D3N, ICONS, IMAGES } = window.TT || {};
      if (!PROGRAMS && !PACKAGES_2D1N && !PACKAGES_3D2N && !PACKAGES_4D3N) return;
      const alertIcon = ICONS?.alert || ALERT_ICON;
      const fmt = new Intl.NumberFormat('en-US');
      const allPackages = [...PROGRAMS, ...(PACKAGES_2D1N || []), ...(PACKAGES_3D2N || []), ...(PACKAGES_4D3N || [])];
      const params = new URLSearchParams(location.search);
      const id = params.get('id') || (allPackages[0] && allPackages[0].id);
      const p = allPackages.find(x => x.id === id);

      const esc = (s) => String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

      const INCLUSION_MAP = {
        boat:       { label: 'Tour boat',       icon: 'longtail' },
        food:       { label: 'Buffet meals',      icon: 'cutlery' },
        guide:      { label: 'Tour staff',    icon: 'users' },
        snorkel:    { label: 'Snorkeling gear',   icon: 'scuba' },
        park:       { label: 'National park fee',      icon: 'ticket' },
        insurance:  { label: 'Accident insurance',   icon: 'shield' },
        coffee:     { label: 'Coffee',               icon: 'cutlery' },
        snack:      { label: 'Snacks',            icon: 'cutlery' },
        lifejacket: { label: 'Life jackets',         icon: 'shield' },
        hotel:      { label: 'Accommodation',             icon: 'bed' },
        shuttle:    { label: 'Transfers',           icon: 'car' },
      };
      const DEFAULT_INCLUSIONS = ['boat', 'food', 'guide', 'snorkel', 'park', 'insurance', 'coffee', 'snack', 'lifejacket'];

      /** Map inclusion key or Thai/English label → { label, icon } */
      function resolveInclusion(item) {
        if (item && typeof item === 'object' && item.label) {
          return {
            label: item.label,
            icon: item.icon || 'info',
          };
        }
        if (INCLUSION_MAP[item]) {
          const m = INCLUSION_MAP[item];
          return { label: m.label, icon: m.icon };
        }
        const text = String(item ?? '');
        const rules = [
          [/tour boat|big boat|large boat/i, 'bigBoat'],
          [/long-?tail|return boat|shore boat/i, 'longtail'],
          [/speed\s*boat|speedboat/i, 'speedboat'],
          [/\bboat\b/i, 'longtail'],
          [/lunch|breakfast|buffet|coffee|snack|drinking water|ice|meal/i, 'cutlery'],
          [/room|hotel|accommodation|stay|resort/i, 'bed'],
          [/transfer|pickup|pick-up|van|car|shuttle/i, 'car'],
          [/guide|staff|crew/i, 'users'],
          [/snorkel|diving|mask|life jacket|gear/i, 'scuba'],
          [/park fee|national park|admission/i, 'ticket'],
          [/insurance/i, 'shield'],
        ];
        for (const [re, icon] of rules) {
          if (re.test(text)) return { label: text, icon };
        }
        return { label: text, icon: 'info' };
      }

      if (!p) {
        document.getElementById('pkg-root').innerHTML = '<div class="container" style="padding:120px 0;text-align:center"><h1>Package not found</h1><p><a href="programs.html">Back to programs</a></p></div>';
        return;
      }

      const gallery = (p.gallery && p.gallery.length) ? p.gallery.slice(0, 6)
        : [p.image, p.image, p.image, p.image, p.image, p.image].map((src, i) => src || IMAGES.heroPrograms);
      while (gallery.length < 6) gallery.push(gallery[gallery.length - 1] || p.image);

      const caption = p.galleryCaption || p.route || (p.stops || []).join(' ');
      const licenseNo = p.licenseNo || '43/00540';
      const code = p.packageCode ? `Code ${p.packageCode}` : `Code #${allPackages.indexOf(p) + 1}`;

      const STOP_DETAILS = {
        'Koh Muk': 'Arrive at Koh Muk, prepare swimming gear, and head to the first stop',
        'Koh Mook': 'Arrive at Koh Muk, prepare swimming gear, and head to the first stop',
        'Emerald Cave': 'Swim through the long cave to the inner beach — Unseen Thailand views and photos',
        'Koh Kradan': 'Relax on white sand, swim in clear water, and enjoy lunch on the boat',
        'Koh Chueak': 'Snorkel colorful coral, fish schools, and underwater photo spots',
        'Koh Waen': 'Stop to snorkel coral and fish around Koh Waen',
        'Pick-up in Trang city': 'Pickup at meeting points in Trang city (surcharge may apply)',
        'Pak Meng Pier': 'Meet at Pak Meng Pier, Sikao District, before departure',
        'Return to pier': 'Return to Pak Meng Pier, rinse and change, and end the program',
      };
      const DEFAULT_TIMES = ['07:00', '09:30', '11:30', '13:30', '15:30', '16:30'];

      function stopDetail(stop, i, total) {
        if (STOP_DETAILS[stop]) return STOP_DETAILS[stop];
        if (i === 0) return `Start activities at ${stop} — ${p.duration || 'Full-day trip'}`;
        if (i === total - 1) return `Stop at ${stop} and return to finish the program`;
        return `Stop at ${stop} — sea views and activities at this stop`;
      }

      function enrichItineraryItem(item, i, total) {
        const time = item.time || DEFAULT_TIMES[i] || '07:00';
        let title = (item.title || '').trim();
        let text = (item.text || item.desc || '').trim();
        if (title && text && title === text) text = stopDetail(title, i, total);
        if (!title && text) {
          const short = text.length <= 36 && !text.includes(' ');
          title = short ? text : text.split(/[—–-]/)[0].trim().slice(0, 40);
          if (!short && title === text) text = stopDetail(title, i, total);
          else if (!short) text = text;
          else text = stopDetail(text, i, total);
        }
        if (title && !text) text = stopDetail(title, i, total);
        return { time, title: title || `Step ${i + 1}`, text };
      }

      const rawItinerary = (p.itinerary && p.itinerary.length) ? p.itinerary
        : (p.stops || []).map((stop, i) => ({
            time: DEFAULT_TIMES[i] || `${String(7 + i * 2).padStart(2, '0')}:00`,
            title: stop,
            text: '',
          }));
      const itinerary = rawItinerary.map((item, i) => enrichItineraryItem(item, i, rawItinerary.length));

      const isPkg2d1n = (PACKAGES_2D1N || []).some((x) => x.id === p.id);
      const isPkg3d2n = (PACKAGES_3D2N || []).some((x) => x.id === p.id);
      const isPkg4d3n = (PACKAGES_4D3N || []).some((x) => x.id === p.id);
      const isMultiNightPkg = isPkg2d1n || isPkg3d2n || isPkg4d3n;

      function parseItineraryDay(title) {
        const m = (title || '').match(/Day\s*(\d+)/i);
        return m ? parseInt(m[1], 10) : null;
      }
      function stripDayPrefix(title) {
        const stripped = (title || '').replace(/^Day\s*\d+\s*[·•\-–—]\s*/i, '').trim();
        return stripped || title;
      }
      const TIME_LAYER_LABELS = {
        1: 'Morning',
        2: 'Late morning',
        3: 'Afternoon',
        4: 'Evening',
      };
      function timeLayer(time) {
        const h = parseInt(String(time || '12:00').split(':')[0], 10);
        if (Number.isNaN(h)) return 1;
        if (h < 9) return 1;
        if (h < 12) return 2;
        if (h < 15) return 3;
        return 4;
      }
      function assignItineraryLayers(items, forceMultiDay = false) {
        let currentDay = 1;
        const hasDayLabels = items.some((item) => /Day\s*\d+/i.test(item.title));
        const daySet = new Set();
        items.forEach((item) => {
          const parsed = parseItineraryDay(item.title);
          if (parsed != null) daySet.add(parsed);
        });
        const maxDay = daySet.size ? Math.max(...daySet) : 1;
        const isMultiDay = forceMultiDay
          || (hasDayLabels && (daySet.size > 1 || maxDay > 1));

        if (forceMultiDay && !hasDayLabels) {
          let lastMinutes = -1;
          let day = 1;
          return items.map((item) => {
            const parsed = parseItineraryDay(item.title);
            if (parsed != null) {
              day = parsed;
            } else {
              const [h, m] = String(item.time || '12:00').split(':').map(Number);
              const mins = (h || 0) * 60 + (m || 0);
              if (lastMinutes >= 0 && mins < lastMinutes - 90) day += 1;
              lastMinutes = mins;
            }
            return {
              ...item,
              layer: day,
              bandLabel: `Day ${day}`,
              isMultiDay: true,
            };
          });
        }

        return items.map((item) => {
          const parsed = parseItineraryDay(item.title);
          if (parsed != null) currentDay = parsed;
          const layer = isMultiDay ? currentDay : timeLayer(item.time);
          const bandLabel = isMultiDay ? `Day ${layer}` : (TIME_LAYER_LABELS[layer] || `Period ${layer}`);
          return { ...item, layer, bandLabel, isMultiDay };
        });
      }
      const itineraryLayers = assignItineraryLayers(itinerary, isMultiNightPkg);
      const BAND_ICONS = {
        time: { 1: 'sun', 2: 'clock', 3: 'compass', 4: 'moon' },
      };
      function bandIcon(layer, isMultiDay) {
        if (isMultiDay) return ICONS.calendar || ICONS.clock;
        const key = BAND_ICONS.time[layer] || 'clock';
        return ICONS[key] || ICONS.clock;
      }

      function splitMealCombo(text) {
        const s = String(text).trim();
        const m = s.match(/^(.+?)\s*[·•]\s*(Breakfast.+)$/i);
        if (!m) return null;
        return { lunch: m[1].trim(), breakfast: m[2].trim() };
      }

      function buildInclusionsByDay(pkg) {
        if (pkg.inclusionsByDay && pkg.inclusionsByDay.length) {
          return pkg.inclusionsByDay.map((block) => ({
            day: block.day,
            label: block.label || `Day ${block.day}`,
            items: block.items || [],
          }));
        }
        if (!isPkg2d1n && !isPkg3d2n && !isPkg4d3n) return null;

        const raw = (pkg.inclusions && pkg.inclusions.length) ? pkg.inclusions : DEFAULT_INCLUSIONS;
        const dayCount = isPkg4d3n ? 4 : isPkg3d2n ? 3 : 2;
        const days = Array.from({ length: dayCount }, (_, i) => ({
          day: i + 1,
          label: `Day ${i + 1}`,
          items: [],
        }));
        const put = (day, item) => {
          if (!item) return;
          const d = days[day - 1];
          if (d && !d.items.includes(item)) d.items.push(item);
        };

        const isDay1Only = (t) => /Day\s*1|tuk-?tuk.*Day\s*1|airport pickup|airport transfer|tuk-?tuk tour/i.test(t);
        const isDay3Only = (t) => /Day\s*3|city tour/i.test(t);
        const isBreakfast = (t) => /breakfast/i.test(t);
        const isReturn = (t) => /return to (shore|pier|mainland)|return boat|long-?tail.*return/i.test(t);
        const isHotel = (t) => /room|hotel|accommodation|lodging|stay/i.test(t);
        const isSeaDay = (t) => /boat|lunch|buffet|snorkel|diving|gear|guide|staff|park fee|insurance|coffee|snack|drinking water|ice|pickup|pick-up|van transfer|city transfer/i.test(t);

        for (const item of raw) {
          const text = String(item);
          const t = text.toLowerCase();
          const combo = splitMealCombo(text);

          if (combo) {
            const lunchDay = isPkg3d2n ? 2 : 1;
            const breakfastMatch = combo.breakfast.match(/(\d+)\s*meals?/i);
            const breakfastCount = breakfastMatch ? parseInt(breakfastMatch[1], 10) : 1;
            put(lunchDay, combo.lunch);
            if (isPkg3d2n && breakfastCount >= 2) {
              put(2, 'Breakfast × 1');
              put(3, 'Breakfast × 1');
            } else {
              put(isPkg3d2n ? 3 : 2, combo.breakfast);
            }
            continue;
          }

          if (isPkg3d2n) {
            if (isDay1Only(text)) { put(1, text); continue; }
            if (/van\s*city tour/i.test(text)) { put(3, text); continue; }
            if (isDay3Only(text)) { put(3, text); continue; }
            if (isBreakfast(text)) { put(3, text); continue; }
            if (isReturn(text)) { put(3, text); continue; }
            if (/(?:room|hotel|accommodation|lodging).{0,20}2\s*nights?/i.test(t)) {
              put(1, text.replace(/\s*2\s*nights?/i, ' · check-in'));
              put(2, 'Continue stay at accommodation');
              continue;
            }
            if (/koh\s*(?:hai|ngai).{0,12}2\s*nights?/i.test(t)) {
              put(1, text);
              put(2, 'Relax on Koh Ngai');
              continue;
            }
            if (isHotel(text)) { put(1, text); continue; }
            if (/van transfer|shuttle van/i.test(t) && !/city tour/i.test(t)) { put(2, text); continue; }
            if (isSeaDay(t) || /koh\s*rok|speed\s*boat/i.test(t)) { put(2, text); continue; }
            put(2, text);
            continue;
          }

          if (isBreakfast(text)) { put(2, text); continue; }
          if (isReturn(text)) { put(2, text); continue; }
          put(1, text);
        }

        if (isPkg2d1n && days[1].items.length === 0) {
          days[1].items.push('Relax at accommodation · checkout per schedule');
        }
        if (isPkg3d2n && days[2].items.length === 0) {
          days[2].items.push('Checkout · return per program');
        }
        if (isPkg4d3n && days[3].items.length === 0) {
          days[3].items.push('Checkout · return per program');
        }

        return days.filter((block) => block.items.length > 0);
      }

      function renderInclusionTile(item) {
        const inc = resolveInclusion(item);
        return `<li class="pkg-inc-tile">
          <span class="pkg-inc-icon">${ICONS[inc.icon] || ICONS.info}</span>
          <span class="pkg-inc-label">${esc(inc.label)}</span>
        </li>`;
      }

      function renderInclusionsSection(pkg, flatInclusions) {
        const byDay = buildInclusionsByDay(pkg);
        if (!byDay) {
          return `<ul class="pkg-inc-grid">${flatInclusions.map(renderInclusionTile).join('')}</ul>`;
        }
        const tabs = byDay.map((block, i) => `
            <button type="button" class="pkg-inc-tab pkg-inc-tab--${block.day}${i === 0 ? ' is-active' : ''}" role="tab" aria-selected="${i === 0 ? 'true' : 'false'}" data-day="${block.day}" id="pkg-inc-tab-${block.day}">
              <span class="pkg-inc-tab-icon">${bandIcon(block.day, true)}</span>
              <span>${esc(block.label)}</span>
            </button>`).join('');
        const panels = byDay.map((block, i) => `
            <div class="pkg-inc-panel${i === 0 ? ' is-active' : ''}" role="tabpanel" data-day="${block.day}" id="pkg-inc-panel-${block.day}" aria-labelledby="pkg-inc-tab-${block.day}"${i === 0 ? '' : ' hidden'}>
              <ul class="pkg-inc-grid pkg-inc-grid--day">${block.items.map(renderInclusionTile).join('')}</ul>
            </div>`).join('');
        return `
          <div class="pkg-inc-switcher" id="pkg-inc-switcher">
            <div class="pkg-inc-tabs" role="tablist" aria-label="Inclusions by day">${tabs}</div>
            <div class="pkg-inc-panels">${panels}</div>
          </div>`;
      }

      function initPkgIncTabs() {
        const root = document.getElementById('pkg-inc-switcher');
        if (!root) return;
        const tabs = [...root.querySelectorAll('.pkg-inc-tab')];
        const panels = [...root.querySelectorAll('.pkg-inc-panel')];
        tabs.forEach((tab) => {
          tab.addEventListener('click', () => {
            const day = tab.dataset.day;
            tabs.forEach((t) => {
              const on = t.dataset.day === day;
              t.classList.toggle('is-active', on);
              t.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            panels.forEach((panel) => {
              const on = panel.dataset.day === day;
              panel.classList.toggle('is-active', on);
              panel.hidden = !on;
            });
          });
        });
      }

      function roomPriceParts(room) {
        if (room && room.price != null && room.price > 0) {
          return { amount: `฿${fmt.format(room.price)}`, unit: '/ person', book: false };
        }
        return { amount: 'Inquire', unit: '', book: true };
      }

      const WW_HOTEL = 'https://www.xn--72c1af3ci9dk0j.com/wp-content/uploads';
      const HOTEL_IMAGE_KEYS = [
        ['Chom Trang', `${WW_HOTEL}/2019/08/%E0%B8%8A%E0%B8%A1%E0%B8%95%E0%B8%A3%E0%B8%B1%E0%B8%87-min.jpg`],
        ['Maison', `${WW_HOTEL}/2019/08/cc78dd160a4c679e30c2776ecec2aa636_4095006_190814_0048.jpg`],
        ['Thap Tiang', `${WW_HOTEL}/2019/08/%E0%B8%93-%E0%B8%97%E0%B8%B1%E0%B8%9A%E0%B9%80%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%87-min.jpg`],
        ['Eco Inn', `${WW_HOTEL}/2019/08/cc78dd160a4c679e30c2776ecec2aa636_4095029_190814_0002-min-1024x683.jpg`],
        ['Maitree', `${WW_HOTEL}/2019/08/cc78dd160a4c679e30c2776ecec2aa636_4095010_190814_0055-min-1024x683.jpg`],
        ['Thammarin', `${WW_HOTEL}/2019/08/cc78dd160a4c679e30c2776ecec2aa636_4094997_190814_0071-min-1024x683.jpg`],
        ['Ruen Rassada', `${WW_HOTEL}/2019/08/Superior_sm-min-1024x683.jpg`],
        ['Koh Ngai Camping', `${WW_HOTEL}/2025/08/%E0%B9%80%E0%B8%81%E0%B8%B2%E0%B8%B0%E0%B9%84%E0%B8%AB%E0%B8%87-%E0%B8%A3%E0%B8%B5%E0%B8%AA%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%97-1-Nov-23-Dec-23-11-Jan-24-Apr-24-3.jpg`],
        ['Koh Ngai Resort', `${WW_HOTEL}/2025/08/%E0%B9%80%E0%B8%81%E0%B8%B2%E0%B8%B0%E0%B9%84%E0%B8%AB%E0%B8%87-%E0%B8%A3%E0%B8%B5%E0%B8%AA%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%97-1-Nov-23-Dec-23-11-Jan-24-Apr-24.jpg`],
        ['Fantasy', `${WW_HOTEL}/2025/08/%E0%B9%81%E0%B8%9F%E0%B8%99%E0%B8%95%E0%B8%B2%E0%B8%8B%E0%B8%B5-%E0%B8%A3%E0%B8%B5%E0%B8%AA%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%97-1-May-31-Oct-23-2.jpg`],
        ['Thapwarin', `${WW_HOTEL}/2025/08/P2-%E0%B8%99%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%81%E0%B8%B2%E0%B8%B0%E0%B9%84%E0%B8%AB%E0%B8%87-%E0%B9%82%E0%B8%9B%E0%B8%A3%E0%B9%81%E0%B8%81%E0%B8%A3%E0%B8%A1%E0%B8%97%E0%B8%B1%E0%B8%A7%E0%B8%A3%E0%B9%8C-%E0%B8%97%E0%B8%B1%E0%B8%9A%E0%B8%A7%E0%B8%B2%E0%B8%A3%E0%B8%B4%E0%B8%99%E0%B8%97%E0%B8%A3%E0%B9%8C.jpg`],

            const min = Number(input.min) || 0;
            const max = Number(input.max) || 80;
            const cur = Number(input.value) || min;
            const next = Math.max(min, Math.min(max, cur + dir));

        }

        function formatThaiDate(d) {
          if (!d) return '-';
          try {
            const dt = new Date(d + 'T12:00:00');
            return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
          } catch { return d; }
        }

        function getSelectedRoomInfo() {
          if (!hotelPicker) return null;
          return hotelPicker.getSelectedRoom();
        }

        function adultUnitPrice() {
          const sel = getSelectedRoomInfo();
          const room = sel?.room;
          if (room?.price != null && room.price > 0) return room.price;
          return Number(pkg.basePrice || 0);
        }

        function childUnitPrice() {
          const adult = adultUnitPrice();
          const base = Number(pkg.basePrice || 0);
          if (base > 0 && adult !== base) {
            return Math.round(childRate * adult / base);
          }
          return childRate;
        }

        function calcPkgTotal(state) {
          const sel = getSelectedRoomInfo();
          const adultPrice = adultUnitPrice();
          const childPriceUnit = childUnitPrice();
          const adultTotal = state.adults * adultPrice;
          const childTotal = state.children * childPriceUnit;
          const room = sel?.room;
          const roomQuoted = !!(room && (room.book || !(room.price > 0)));
          return {
            adultTotal,
            childTotal,
            total: adultTotal + childTotal,
            adultPrice,
            childPriceUnit,
            isBookOnly: adultPrice <= 0,
            roomQuoted,
            selection: sel,
          };
        }

        function renderPkgTotal() {
          const state = getPkgState();
          const calc = calcPkgTotal(state);
          const lines = [];
          if (state.adults > 0) {
            const adultLabel = calc.isBookOnly
              ? `Adults × ${state.adults}`
              : `Adults ${fmt.format(calc.adultPrice)} × ${state.adults}`;
            const adultSum = calc.isBookOnly ? 'Inquire' : `฿${fmt.format(calc.adultTotal)}`;
            lines.push(`<div class="pkg-book-price-line"><span>${adultLabel}</span><span>${adultSum}</span></div>`);
          }
          if (state.children > 0) {
            const childLabel = calc.isBookOnly
              ? `Children × ${state.children}`
              : `Children ${fmt.format(calc.childPriceUnit)} × ${state.children}`;
            const childSum = calc.isBookOnly ? 'Inquire' : `฿${fmt.format(calc.childTotal)}`;
            lines.push(`<div class="pkg-book-price-line"><span>${childLabel}</span><span>${childSum}</span></div>`);
          }
          if (calc.selection?.hotelName) {
            const rp = roomPriceParts(calc.selection.room);
            let priceText;
            if (rp.book) {
              priceText = calc.adultPrice > 0
                ? `~${esc(`฿${fmt.format(calc.adultPrice)}`)}/person`
                : 'Inquire';
            } else {
              priceText = `${rp.amount}${rp.unit ? ` ${rp.unit}` : ''}`;
            }
            lines.push(`<div class="pkg-book-price-line is-meta"><span>${esc(calc.selection.hotelName)} · ${esc(calc.selection.roomName)}</span><span>${priceText}</span></div>`);
          }
          const linesEl = document.getElementById('pkg-book-lines');
          const totalEl = document.getElementById('pkg-book-total');
          if (linesEl) linesEl.innerHTML = lines.join('');
          if (totalEl) {
            totalEl.textContent = calc.isBookOnly ? 'Inquire' : ('฿' + fmt.format(calc.total));
          }
          return { state, calc };
        }
        renderPkgTotalFn = renderPkgTotal;

        function validatePkgForm(state) {
          let ok = true;
          if (hotels?.length && !getSelectedRoomInfo()?.roomName) {
            window.TT?.toast?.('Please select a hotel and room type');
            ok = false;
          }
          if (!state.date) { setPkgError('date', 'Please select a travel date'); ok = false; }
          else setPkgError('date', '');
          if (!state.adults || state.adults < 1) { setPkgError('adults', 'At least 1 adult required'); ok = false; }
          else setPkgError('adults', '');
          if (state.children < 0) { setPkgError('children', 'Invalid number of children'); ok = false; }
          else setPkgError('children', '');
          if (!state.name) { setPkgError('name', 'Please enter your name'); ok = false; }
          else setPkgError('name', '');
          const phoneClean = state.phone.replace(/\D/g, '');
          if (!state.phone || phoneClean.length < 9) {
            setPkgError('phone', state.phone ? 'Invalid phone number' : 'Please enter your phone number');
            ok = false;
          } else setPkgError('phone', '');
          return ok;
        }

        function buildPkgLineMessage(state, calc) {
          const code = pkg.packageCode ? `Code ${pkg.packageCode}` : `ID ${pkg.id}`;
          const L = [
            'Hello, I would like to book a tour package',
            '',
            '— Package —',
            `${pkg.name}`,
            code,
            pkg.route ? `Route: ${pkg.route}` : '',
            pkg.duration ? `Duration: ${pkg.duration}` : '',
            '',
            '— Guest details —',
            `Name: ${state.name}`,
            `Phone: ${state.phone}`,
            `Start date: ${formatThaiDate(state.date)}`,
            state.dateEnd ? `End date: ${formatThaiDate(state.dateEnd)}` : '',
            `Adults: ${state.adults}`,
          ];
          if (state.children > 0) L.push(`Children: ${state.children}`);
          L.push(`Total: ${state.people} guests`);
          if (calc.selection?.hotelName) {
            L.push('');
            L.push('— Accommodation —');
            L.push(`Hotel: ${calc.selection.hotelName}`);
            L.push(`Room: ${calc.selection.roomName}`);
            const rp = roomPriceParts(calc.selection.room);
            if (rp.book && calc.adultPrice > 0) {
              L.push(`Price: ~฿${fmt.format(calc.adultPrice)}/person (from · confirmed by team per hotel)`);
            } else {
              L.push(`Price: ${rp.amount}${rp.unit ? ' ' + rp.unit : ''}`);
            }
          }
          L.push('');
          L.push('— Price summary —');
          if (calc.isBookOnly) {
            L.push('>>> Price: Inquire (team will confirm) <<<');
          } else {
            if (state.adults > 0) L.push(`Adults: ฿${fmt.format(calc.adultPrice)} × ${state.adults} = ฿${fmt.format(calc.adultTotal)}`);
            if (state.children > 0) L.push(`Children: ฿${fmt.format(calc.childPriceUnit)} × ${state.children} = ฿${fmt.format(calc.childTotal)}`);
            L.push(`>>> Estimated total: ฿${fmt.format(calc.total)} <<<`);
            if (calc.roomQuoted) L.push('(Selected hotel rate may vary by season · confirmed on LINE)');
          }
          if (state.note) {
            L.push('');
            L.push('— Notes —');
            L.push(state.note);
          }
          L.push('');
          L.push('Please contact me to confirm the booking. Thank you.');
          return L.filter(Boolean).join('\n');
        }

        form.querySelectorAll('input, textarea').forEach((el) => {
          el.addEventListener('input', renderPkgTotal);
          el.addEventListener('change', renderPkgTotal);
        });
        renderPkgTotal();

        document.getElementById('pkg-book-line')?.addEventListener('click', () => {
          const { state, calc } = renderPkgTotal();
          if (!validatePkgForm(state)) {
            window.TT?.toast?.('Please complete all required fields');
            return;
          }
          const msg = buildPkgLineMessage(state, calc);
          try { navigator.clipboard?.writeText(msg); } catch {}
          window.TT?.toast?.('Copied — opening LINE…');
          window.open(lineUrl, '_blank', 'noopener');
        });

        document.getElementById('pkg-book-copy')?.addEventListener('click', () => {
          const { state, calc } = renderPkgTotal();
          if (!validatePkgForm(state)) {
            window.TT?.toast?.('Please complete all fields before copying');
            return;
          }
          const msg = buildPkgLineMessage(state, calc);
          navigator.clipboard?.writeText(msg).then(
            () => window.TT?.toast?.('Copied — ready to send on LINE'),
            () => window.TT?.toast?.('Copy failed')
          );
        });
      }

    }

    document.addEventListener('DOMContentLoaded', renderProgramPage);
    document.addEventListener('tt:data-updated', renderProgramPage);
  </script>
</body>
</html>
