<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment received — Suwan Travel</title>
  <meta name="theme-color" content="#0277bd" />
  <link rel="icon" type="image/png" href="assets/logo/logo.png" />
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="site-header"></div>
  <section class="section" style="padding-top: calc(var(--header-h) + 3rem);">
    <div class="container" style="max-width: 640px;">
      <span class="eyebrow">Payment</span>
      <h1>Payment received</h1>
      <p class="lead">Thank you. We have the full payment for your booking<span id="ok-ref"></span>. We will confirm the pickup time on WhatsApp.</p>
      <a class="btn btn-primary" href="index.html">Back to home</a>
    </div>
  </section>
  <div id="site-footer"></div>
  <script>document.write('<script src="assets/js/tt-cache-version.js?t='+Date.now()+'"><\/script>');</script>
  <script>document.write('<script src="assets/js/data-fallback.js?v='+(encodeURIComponent(window.__TT_SCRIPT_V||Date.now()))+'"><\/script>');</script>
  <script>document.write('<script src="assets/js/data.js?v='+(encodeURIComponent(window.__TT_SCRIPT_V||Date.now()))+'"><\/script>');</script>
  <script>document.write('<script src="assets/js/main.js?v='+(encodeURIComponent(window.__TT_SCRIPT_V||Date.now()))+'"><\/script>');</script>
  <script>
    const ref = new URLSearchParams(location.search).get('ref');
    if (ref) document.getElementById('ok-ref').textContent = ' (' + ref + ')';
    try { sessionStorage.removeItem('tt-checkout'); } catch (e) {}
  </script>
</body>
</html>
